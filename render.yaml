services:
  # 1. Django Web Service (Daphne ASGI Server with WebSocket & HTTP support)
  - type: web
    name: cinepass-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --noinput && python manage.py sync_movies --pages 2 && daphne -b 0.0.0.0 -p $PORT movie_discovery_system.asgi:application"
    healthCheckPath: "/api/health/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: movie_discovery_system.settings.prod
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cinepass-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cinepass-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: cinepass-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: cinepass-redis
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: CinePass <onboarding@resend.dev>
      - key: BREVO_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_BACKEND
        value: apps.bookings.resilient_smtp.ResilientEmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: ynaveensai1368@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: qqlnguwcodkiuhju
      - key: DEFAULT_FROM_EMAIL
        value: CinePass <ynaveensai1368@gmail.com>
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # 2. Celery Worker Background Service
  - type: worker
    name: cinepass-celery-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A movie_discovery_system worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: movie_discovery_system.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: cinepass-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cinepass-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: cinepass-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: cinepass-redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: CinePass <onboarding@resend.dev>
      - key: EMAIL_BACKEND
        value: apps.bookings.resilient_smtp.ResilientEmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: CinePass <ynaveensai1368@gmail.com>
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: ynaveensai1368@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: qqlnguwcodkiuhju
      - key: BREVO_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

  # 3. Redis Instance
  - type: redis
    name: cinepass-redis
    ipAllowList: [] # Internal network only

databases:
  # 4. Managed PostgreSQL Database
  - name: cinepass-db
    databaseName: cinepass_db
    user: cinepass_user

