<!-- Global Interactive Trailer Modal -->
<div class="modal fade" id="globalTrailerModal" tabindex="-1" aria-labelledby="globalTrailerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-dark border-secondary shadow-lg">
            <div class="modal-header border-secondary d-flex justify-content-between align-items-center">
                <h5 class="modal-title text-white fw-bold d-flex align-items-center" id="globalTrailerModalLabel">
                    <i class="fa-solid fa-film text-danger me-2"></i>
                    <span id="globalTrailerMovieTitle">Official Movie Trailer</span>
                </h5>
                <div class="d-flex align-items-center gap-2">
                    <a id="globalTrailerWatchBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline-danger btn-sm">
                        <i class="fa-brands fa-youtube me-1"></i> Watch on YouTube
                    </a>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            </div>
            <div class="modal-body p-0">
                <div class="ratio ratio-16x9">
                    <iframe id="globalTrailerIframe"
                            src=""
                            title="Official Movie Trailer"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen
                            referrerpolicy="strict-origin-when-cross-origin"
                            class="w-100 h-100 border-0">
                    </iframe>

                </div>
                <!-- Fallback shown when embedding is restricted -->
                <div id="globalTrailerFallback" class="text-center py-5 d-none">
                    <i class="fa-solid fa-triangle-exclamation text-warning fs-1 mb-3 d-block"></i>
                    <p class="text-light mb-3">This trailer playback is restricted to YouTube.</p>
                    <a id="globalTrailerFallbackLink" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-danger btn-lg px-4">
                        <i class="fa-brands fa-youtube me-2"></i> Watch on YouTube
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
