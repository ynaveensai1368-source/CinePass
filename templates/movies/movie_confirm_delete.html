{% extends 'base.html' %}

{% block title %}Delete Movie - {{ object.title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark border-danger rounded-4 p-4 text-center">
                <i class="fa-solid fa-triangle-exclamation text-danger display-3 mb-3"></i>
                <h3 class="text-white fw-bold">Confirm Delete</h3>
                <p class="text-secondary">Are you sure you want to permanently delete movie <strong>"{{ object.title }}"</strong>? This action cannot be undone.</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                        <a href="{% url 'movies:detail' object.slug %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
